name: discord-poll

# Manual fallback only. The bot runs on Cloudflare Workers (worker/, cron every 10 minutes) since 2026-11-10:
# GitHub started these scheduled runs hours late (2 runs in a day), so the schedule was removed.
# The Actions state (cache) is separate from the Worker's KV state — run this only while the Worker is down.
on:
  workflow_dispatch: {}

concurrency:
  group: discord-poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Poll Discord
        run: python3 poll.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}
